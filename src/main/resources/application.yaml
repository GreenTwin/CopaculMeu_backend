server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: copaculmeu
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # Database connection
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/copacul_meu}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # JPA and Hibernate
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '0'
    validate-on-migrate: true

# Actuator: expose only the health endpoint (used by Railway healthchecks)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Springdoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false

# Scalar API Documentation UI configuration
scalar:
  enabled: true
  path: /scalar
  page-title: "Copacul Meu - API Reference"
  theme: purple
  layout: modern
  show-sidebar: true
  dark-mode: true

app:
  security:
    pepper: ${APP_SECURITY_PEPPER}
    activation-code-secret: ${APP_SECURITY_ACTIVATION_CODE_SECRET}
    jwt:
      secret: ${APP_JWT_SECRET}
      expiration-seconds: 86400
