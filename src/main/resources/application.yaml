server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: copaculmeu
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # Database connection
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/copacul_meu}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # JPA and Hibernate
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '0'
    validate-on-migrate: true

  # SMTP Mail configuration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}

# Actuator: expose only the health endpoint (used by Railway healthchecks)
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Springdoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false

# Scalar API Documentation UI configuration
scalar:
  enabled: true
  path: /scalar
  page-title: "Copacul Meu - API Reference"
  theme: purple
  layout: modern
  show-sidebar: true
  dark-mode: true

app:
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM:noreply@copaculmeu.ro}
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  security:
    pepper: ${APP_SECURITY_PEPPER}
    activation-code-secret: ${APP_SECURITY_ACTIVATION_CODE_SECRET}
    jwt:
      secret: ${APP_JWT_SECRET}
      expiration-seconds: 86400
